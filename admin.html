<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration · Ma Boutique</title>
<meta name="theme-color" content="#1d3557">
<link rel="stylesheet" href="css/style.css">
<style>
.adm{max-width:720px;margin:16px auto;padding:0 16px 40px}
.box{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:1.05rem}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:.9rem}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.chk input{width:auto}
input,select,textarea{width:100%;border:1px solid #cfc9b9;border-radius:12px;padding:11px;font:inherit;background:#fff}
textarea{min-height:100px;resize:vertical}
.full{width:100%;margin-top:14px}
.msg{margin-top:10px;padding:10px;border-radius:12px;font-size:.9rem;word-break:break-word}
.msg.ok{background:#e3f5ec;color:#0b5a40}
.msg.bad{background:#fde8ea;color:#a1102a}
.item{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.item h4{margin:0 0 4px;font-size:1rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btns .btn{padding:9px 14px;font-size:.88rem}
.off{background:#e4e0d6;color:#1b2430}
.b-del{background:#a1102a;color:#fff}
.err{background:#fde8ea;color:#a1102a;border-color:#f3c1c8}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">Ma Boutique</a>
  <nav class="nav"><a href="index.html">Voir la boutique</a><a id="lo" href="#" class="hide">Déconnexion</a></nav>
</div></header>

<div class="adm">
  <h1 style="margin:0 0 10px">Administration</h1>
  <p id="state" class="notice">Chargement…</p>

  <div id="login" class="box hide">
    <h3>Connexion</h3>
    <form id="lf" novalidate>
      <label for="le">Email</label>
      <input id="le" type="email" autocomplete="email">
      <label for="lp">Mot de passe</label>
      <input id="lp" type="password" autocomplete="current-password">
      <button id="lb" class="btn btn-p full" type="submit">Se connecter</button>
      <div id="lmsg" class="msg hide"></div>
    </form>
  </div>

  <div id="app" class="hide">
    <select id="sec" class="sel" style="width:100%;margin-bottom:14px" aria-label="Section">
      <option value="products">Produits</option>
      <option value="categories">Catégories</option>
      <option value="texts">Textes de la boutique</option>
    </select>
    <div id="view"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var C = window.KOLINK_CONFIG || {};
  var $ = function (i) { return document.getElementById(i); };
  var token = null, uid = null, CATS = [], PROD = {};
  var TEXTS = [
    ["brand_name", "Nom de la boutique", "input"],
    ["tagline", "Slogan (bas de page)", "input"],
    ["home_title", "Titre de l'accueil", "input"],
    ["home_text", "Texte de l'accueil", "area"],
    ["affiliate_notice", "Mention d'affiliation", "area"]
  ];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function say(id, text, ok) {
    var m = $(id);
    if (!m) return;
    m.textContent = text;
    m.className = "msg " + (ok ? "ok" : "bad");
  }
  function note(t, bad) { return '<p class="notice' + (bad ? " err" : "") + '">' + esc(t) + "</p>"; }
  function fail() { $("view").innerHTML = note("Impossible de charger cette section. Réessaie plus tard.", true); }

  function call(method, path, body, prefer) {
    var h = { apikey: C.SUPABASE_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json" };
    if (prefer) h.Prefer = prefer;
    return fetch(C.SUPABASE_URL + "/rest/v1/" + path, {
      method: method, headers: h, body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = null;
        try { d = JSON.parse(t); } catch (e) {}
        if (!r.ok) throw new Error("code " + r.status + " " + t.slice(0, 120));
        return d;
      });
    });
  }

  /* ---------- Images ---------- */
  function shrink(file) {
    if (!file.size) return Promise.reject(new Error("Fichier vide ou inaccessible"));
    function draw(src, w, h) {
      var k = Math.min(1, 1024 / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w * k));
      c.height = Math.max(1, Math.round(h * k));
      c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
      return new Promise(function (res, rej) {
        c.toBlob(function (b) { b ? res(b) : rej(new Error("toBlob vide")); }, "image/jpeg", 0.8);
      });
    }
    function viaBitmap() {
      if (!window.createImageBitmap) return Promise.reject(new Error("no"));
      return createImageBitmap(file).then(function (bm) { return draw(bm, bm.width, bm.height); });
    }
    function viaImage() {
      return new Promise(function (res, rej) {
        var r = new FileReader();
        r.onload = function () {
          var img = new Image();
          img.onload = function () { draw(img, img.width, img.height).then(res, rej); };
          img.onerror = function () { rej(new Error("no")); };
          img.src = r.result;
        };
        r.onerror = function () { rej(new Error("no")); };
        r.readAsDataURL(file);
      });
    }
    return viaBitmap().catch(viaImage).catch(function () {
      if (file.size <= 2097152 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
      throw new Error("Photo illisible");
    });
  }
  function upload(blob) {
    var ct = blob.type || "image/jpeg";
    var ext = ct === "image/png" ? "png" : (ct === "image/webp" ? "webp" : "jpg");
    var path = uid + "/shop-" + Date.now() + "." + ext;
    return fetch(C.SUPABASE_URL + "/storage/v1/object/images/" + path, {
      method: "POST",
      headers: { apikey: C.SUPABASE_KEY, Authorization: "Bearer " + token, "Content-Type": ct },
      body: blob
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error("Photo refusée (code " + r.status + ") " + t.slice(0, 100)); });
      return C.SUPABASE_URL + "/storage/v1/object/public/images/" + path;
    }, function () { throw new Error("Réseau : envoi de la photo impossible"); });
  }

  /* ---------- Produits ---------- */
  function productForm() {
    return '<div class="box"><h3 id="ftitle">Ajouter un produit</h3><form id="pf" novalidate>' +
      '<input type="hidden" id="pid">' +
      '<label for="pt">Titre</label><input id="pt" maxlength="140">' +
      '<label for="pc">Catégorie</label><select id="pc"></select>' +
      '<label for="pp">Partenaire</label><input id="pp" maxlength="80" placeholder="Nom du programme ou du vendeur">' +
      '<label for="pe">Prix en euros (facultatif)</label><input id="pe" inputmode="decimal" placeholder="Ex. : 9,90">' +
      '<label for="pa">Lien affilié officiel (https://…)</label><input id="pa" inputmode="url" maxlength="1000">' +
      '<label for="pi">Image : adresse https (facultatif)</label><input id="pi" inputmode="url" maxlength="500">' +
      '<label for="pfile">… ou envoie une photo (remplace l\'adresse)</label><input id="pfile" type="file" accept="image/*">' +
      '<label for="pd">Description originale</label><textarea id="pd" maxlength="4000"></textarea>' +
      '<label class="chk"><input type="checkbox" id="pdemo"> Produit de démonstration (aucun lien d\'achat)</label>' +
      '<label class="chk"><input type="checkbox" id="pact" checked> Visible sur le site</label>' +
      '<button id="psave" class="btn btn-p full" type="submit">Enregistrer</button>' +
      '<button id="pcancel" class="btn off full hide" type="button" data-act="cancel">Annuler la modification</button>' +
      '<div id="pmsg" class="msg hide"></div></form></div>';
  }

  function item(p) {
    var cat = "";
    CATS.forEach(function (c) { if (c.id === p.category_id) cat = c.name; });
    var price = p.price_eur != null
      ? Number(p.price_eur).toLocaleString("fr-FR", { style: "currency", currency: "EUR" })
      : "Prix non indiqué";
    var id = esc(p.id);
    return '<div class="item"><h4>' + esc(p.title) + '</h4><div class="meta">' + esc(cat) + " · " +
      esc(p.partner_name || "Partenaire non indiqué") + " · " + esc(price) + "</div>" +
      (p.active ? '<span class="tag">Visible</span>' : '<span class="tag demo">Masqué</span>') +
      (p.is_demo ? ' <span class="tag demo">Exemple</span>' : "") +
      (!p.is_demo && !p.affiliate_url ? ' <span class="tag demo">Sans lien</span>' : "") +
      '<div class="btns"><button class="btn btn-p" type="button" data-act="edit" data-id="' + id + '">Modifier</button>' +
      '<button class="btn off" type="button" data-act="toggle" data-id="' + id + '">' + (p.active ? "Masquer" : "Afficher") + "</button>" +
      '<button class="btn b-del" type="button" data-act="del" data-id="' + id + '">Supprimer</button></div></div>';
  }

  function loadProducts() {
    $("view").innerHTML = note("Chargement…");
    Promise.all([
      call("GET", "shop_categories?select=id,name,active&order=sort_order.asc"),
      call("GET", "shop_products?select=id,category_id,title,description,image_url,price_eur,partner_name,affiliate_url,is_demo,active&order=created_at.desc&limit=200")
    ]).then(function (r) {
      CATS = r[0];
      PROD = {};
      r[1].forEach(function (p) { PROD[p.id] = p; });
      $("view").innerHTML = productForm() + "<h3>Produits (" + r[1].length + ")</h3>" +
        (r[1].length ? r[1].map(item).join("") : note("Aucun produit pour le moment."));
      $("pc").innerHTML = CATS.map(function (c) {
        return '<option value="' + c.id + '">' + esc(c.name) + (c.active ? "" : " (masquée)") + "</option>";
      }).join("");
    }).catch(fail);
  }

  function resetForm() {
    $("pf").reset();
    $("pid").value = "";
    $("ftitle").textContent = "Ajouter un produit";
    $("pcancel").className = "btn off full hide";
    $("pmsg").className = "msg hide";
  }

  function startEdit(id) {
    var p = PROD[id];
    if (!p) return;
    $("pid").value = p.id;
    $("pt").value = p.title || "";
    $("pc").value = String(p.category_id);
    $("pp").value = p.partner_name || "";
    $("pe").value = p.price_eur != null ? String(p.price_eur).replace(".", ",") : "";
    $("pa").value = p.affiliate_url || "";
    $("pi").value = p.image_url || "";
    $("pd").value = p.description || "";
    $("pdemo").checked = !!p.is_demo;
    $("pact").checked = !!p.active;
    $("ftitle").textContent = "Modifier le produit";
    $("pcancel").className = "btn off full";
    $("pmsg").className = "msg hide";
    $("pf").scrollIntoView();
  }

  function saveProduct() {
    var id = $("pid").value;
    var title = $("pt").value.trim();
    var aff = $("pa").value.trim();
    var img = $("pi").value.trim();
    var priceTxt = $("pe").value.trim().replace(",", ".");
    var price = null;
    if (title.length < 3) return say("pmsg", "Entre un titre (3 caractères minimum).", false);
    if (!$("pc").value) return say("pmsg", "Choisis une catégorie.", false);
    if (priceTxt) {
      price = Number(priceTxt);
      if (!isFinite(price) || price < 0 || price > 100000) return say("pmsg", "Prix invalide.", false);
      price = Math.round(price * 100) / 100;
    }
    if (aff && !/^https:\/\/\S+$/.test(aff)) return say("pmsg", "Le lien affilié doit commencer par https://", false);
    if (img && !/^https:\/\/\S+$/.test(img)) return say("pmsg", "L'adresse de l'image doit commencer par https://", false);
    $("psave").disabled = true;
    say("pmsg", "Enregistrement…", true);
    var file = $("pfile").files && $("pfile").files[0];
    var step = file ? shrink(file).then(upload) : Promise.resolve(img);
    step.then(function (url) {
      var body = {
        category_id: Number($("pc").value), title: title,
        description: $("pd").value.trim() || null,
        image_url: url || null, price_eur: price,
        partner_name: $("pp").value.trim() || null,
        affiliate_url: aff || null,
        is_demo: $("pdemo").checked, active: $("pact").checked
      };
      return id
        ? call("PATCH", "shop_products?id=eq." + encodeURIComponent(id), body, "return=minimal")
        : call("POST", "shop_products", body, "return=minimal");
    }).then(loadProducts).catch(function (er) {
      say("pmsg", "Enregistrement impossible : " + (er && er.message ? er.message : "erreur"), false);
      $("psave").disabled = false;
    });
  }

  /* ---------- Catégories ---------- */
  function loadCategories() {
    $("view").innerHTML = note("Chargement…");
    call("GET", "shop_categories?select=id,name,active,sort_order&order=sort_order.asc").then(function (rows) {
      CATS = rows;
      var h = '<div class="box"><h3>Ajouter une catégorie</h3><form id="cf" novalidate>' +
        '<label for="cn">Nom</label><input id="cn" maxlength="60">' +
        '<button class="btn btn-p full" type="submit">Ajouter</button><div id="cmsg" class="msg hide"></div></form></div>';
      h += rows.map(function (c) {
        return '<div class="item"><h4>' + esc(c.name) + "</h4>" +
          (c.active ? '<span class="tag">Visible</span>' : '<span class="tag demo">Masquée</span>') +
          '<div class="btns"><button class="btn off" type="button" data-act="cat-rename" data-id="' + c.id + '" data-name="' + esc(c.name) + '">Renommer</button>' +
          '<button class="btn off" type="button" data-act="cat-toggle" data-id="' + c.id + '" data-to="' + (c.active ? "false" : "true") + '">' +
          (c.active ? "Masquer" : "Afficher") + "</button></div></div>";
      }).join("");
      $("view").innerHTML = h;
    }).catch(fail);
  }
  function addCategory() {
    var name = $("cn").value.trim();
    if (name.length < 2) return say("cmsg", "Entre un nom (2 caractères minimum).", false);
    var max = 0;
    CATS.forEach(function (c) { if (c.sort_order > max) max = c.sort_order; });
    call("POST", "shop_categories", { name: name, sort_order: max + 1 }, "return=minimal")
      .then(loadCategories)
      .catch(function () { say("cmsg", "Ajout impossible (ce nom existe peut-être déjà).", false); });
  }

  /* ---------- Textes ---------- */
  function loadTexts() {
    $("view").innerHTML = note("Chargement…");
    call("GET", "shop_settings?select=key,value").then(function (rows) {
      var v = {};
      rows.forEach(function (r) { v[r.key] = r.value; });
      var h = '<div class="box"><h3>Textes de la boutique</h3><form id="tf" novalidate>';
      TEXTS.forEach(function (t) {
        h += '<label for="t_' + t[0] + '">' + esc(t[1]) + "</label>" +
          (t[2] === "input" ? '<input id="t_' + t[0] + '" maxlength="200">' : '<textarea id="t_' + t[0] + '" maxlength="2000"></textarea>');
      });
      h += '<button class="btn btn-p full" type="submit">Enregistrer</button><div id="tmsg" class="msg hide"></div></form></div>';
      $("view").innerHTML = h;
      TEXTS.forEach(function (t) { $("t_" + t[0]).value = v[t[0]] || ""; });
    }).catch(fail);
  }
  function saveTexts() {
    var body = TEXTS.map(function (t) { return { key: t[0], value: $("t_" + t[0]).value.trim() }; });
    say("tmsg", "Enregistrement…", true);
    call("POST", "shop_settings?on_conflict=key", body, "resolution=merge-duplicates,return=minimal")
      .then(function () { say("tmsg", "Textes enregistrés.", true); })
      .catch(function () { say("tmsg", "Enregistrement impossible.", false); });
  }

  /* ---------- Actions ---------- */
  function load() {
    var s = $("sec").value;
    if (s === "products") loadProducts();
    else if (s === "categories") loadCategories();
    else loadTexts();
  }
  function mutate(btn, method, path, body) {
    btn.disabled = true;
    call(method, path, body, "return=representation").then(function (d) {
      if (!d || !d.length) throw new Error("refusé");
      load();
    }).catch(function () { btn.disabled = false; alert("Action refusée ou impossible."); });
  }

  $("view").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
    if (act === "edit") startEdit(id);
    else if (act === "cancel") resetForm();
    else if (act === "toggle") mutate(b, "PATCH", "shop_products?id=eq." + encodeURIComponent(id), { active: !PROD[id].active });
    else if (act === "del") {
      if (!confirm("Supprimer ce produit définitivement ?")) return;
      mutate(b, "DELETE", "shop_products?id=eq." + encodeURIComponent(id));
    } else if (act === "cat-toggle") {
      mutate(b, "PATCH", "shop_categories?id=eq." + encodeURIComponent(id), { active: b.getAttribute("data-to") === "true" });
    } else if (act === "cat-rename") {
      var n = prompt("Nouveau nom :", b.getAttribute("data-name") || "");
      if (n === null) return;
      n = n.trim();
      if (n.length < 2 || n.length > 60) { alert("Le nom doit avoir entre 2 et 60 caractères."); return; }
      mutate(b, "PATCH", "shop_categories?id=eq." + encodeURIComponent(id), { name: n });
    }
  });
  $("view").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target.id;
    if (f === "pf") saveProduct();
    else if (f === "cf") addCategory();
    else if (f === "tf") saveTexts();
  });
  $("sec").addEventListener("change", load);

  $("lo").addEventListener("click", function (e) {
    e.preventDefault();
    KL.logout().then(function () { location.reload(); });
  });
  $("lf").addEventListener("submit", function (e) {
    e.preventDefault();
    var em = $("le").value.trim(), pw = $("lp").value;
    if (!em || pw.length < 6) return say("lmsg", "Entre ton email et ton mot de passe.", false);
    $("lb").disabled = true;
    say("lmsg", "Connexion…", true);
    KL.login(em, pw).then(function () {
      $("lb").disabled = false;
      boot();
    }).catch(function (er) {
      say("lmsg", KL.fr(er && er.message), false);
      $("lb").disabled = false;
    });
  });

  function boot() {
    KL.session().then(function (s) {
      if (!s) { $("state").className = "hide"; $("login").className = "box"; return; }
      token = s.access_token; uid = s.user.id;
      $("lo").className = "";
      $("login").className = "box hide";
      return fetch(C.SUPABASE_URL + "/rest/v1/rpc/is_admin", {
        method: "POST",
        headers: { apikey: C.SUPABASE_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: "{}"
      }).then(function (r) { return r.ok ? r.json() : false; }).then(function (ok) {
        if (ok !== true) {
          $("state").textContent = "Accès réservé à l'administrateur.";
          $("state").className = "notice err";
          return;
        }
        $("state").className = "hide";
        $("app").className = "";
        load();
      });
    }).catch(function () {
      $("state").textContent = "Impossible de vérifier ton accès. Réessaie plus tard.";
      $("state").className = "notice err";
    });
  }
  boot();
})();
</script>
</body>
  </html>
